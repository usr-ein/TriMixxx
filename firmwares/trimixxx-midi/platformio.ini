; TriMixxx S3 master -- OneButton ring(s) + deck controls, MIDI bridge to the Pi
[platformio]
description = TriMixxx S3 master firmware (trimixxx-midi)

[env:lolin_s3_mini]
platform = espressif32
board = lolin_s3_mini
framework = arduino
monitor_speed = 115200
; lib_ldf_mode = deep+

; Pin the native-USB CDC port so upload + monitor skip auto-detection.
; macOS enumerates the LOLIN S3 Mini here; change if your host differs
; (Linux: /dev/ttyACM0, or `pio device list` to check).
upload_port = /dev/cu.usbmodem1101
monitor_port = /dev/cu.usbmodem1101

; LOLIN S3 Mini uses native USB for programming + serial console
build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1

; The OneButtonRing library in lib/OneButtonRing is auto-detected by
; PlatformIO's Library Dependency Finder -- no extra config needed.

; ESP32Encoder wraps the hardware PCNT for the jog wheel (handles the
; IDF 4.x / 5.x pcnt API split). Pin loosely to the 0.11.x line.
lib_deps =
    madhephaestus/ESP32Encoder@^0.11.0

; Static analysis: `pio check`. cppcheck over our own code only (src + lib),
; skipping framework/library-dep packages. Suppressions target cppcheck's
; usual embedded/Arduino false positives, not real issues.
check_tool = cppcheck
check_skip_packages = yes
check_src_filters =
    +<src/>
    +<lib/>
check_flags =
    cppcheck: --enable=warning,style,performance,portability --inline-suppr
    cppcheck: --suppress=missingIncludeSystem --suppress=unusedFunction --suppress=unmatchedSuppression
    ; third-party lib headers pulled in via includes -- not our code
    cppcheck: --suppress=*:*ESP32Encoder*
    ; canonical Buxton state table: `R_START | DIR_x` documents intent, keep it
    cppcheck: --suppress=badBitmaskCheck:*TrackEncoder.cpp