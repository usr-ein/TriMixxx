; TriMixxx S3 master -- OneButton ring(s) + deck controls, MIDI bridge to the Pi
[platformio]
description = TriMixxx S3 master firmware (trimixxx-midi)

[env:lolin_s3_mini]
platform = espressif32
board = lolin_s3_mini
framework = arduino
monitor_speed = 115200
; lib_ldf_mode = deep+

; LOLIN S3 Mini uses native USB for programming + serial console
build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1

; The OneButtonRing library in lib/OneButtonRing is auto-detected by
; PlatformIO's Library Dependency Finder -- no extra config needed.

; ESP32Encoder wraps the hardware PCNT for the jog wheel (handles the
; IDF 4.x / 5.x pcnt API split). Pin loosely to the 0.11.x line.
lib_deps =
    madhephaestus/ESP32Encoder@^0.11.0