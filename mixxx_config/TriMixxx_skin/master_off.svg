<?xml version="1.0" encoding="UTF-8"?>
<!-- TEMPO MASTER, not held. Outlined rather than filled: the filled orange
     form is reserved for actually holding it, so the two states differ in
     weight as well as in colour and read apart at arm's length. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 52 52" width="52" height="52">
  <rect x="1.5" y="1.5" width="49" height="49" rx="7"
        fill="#141414" stroke="#3a3a3a" stroke-width="2"/>
  <path d="M15 36 V17 l11 13 11 -13 V36"
        fill="none" stroke="#8a8a8a" stroke-width="4"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
