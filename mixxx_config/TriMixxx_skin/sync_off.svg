<?xml version="1.0" encoding="UTF-8"?>
<!-- BEAT SYNC, idle. The two-arrow glyph a CDJ uses: one arrow out over the
     top, one back along the bottom, because sync is a round trip and not a
     one-way follow. Drawn rather than photographed so it stays crisp at the
     one size this panel ever draws it at. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 52 52" width="52" height="52">
  <rect x="1.5" y="1.5" width="49" height="49" rx="7"
        fill="#141414" stroke="#3a3a3a" stroke-width="2"/>
  <g fill="none" stroke="#8a8a8a" stroke-width="3.4"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="M14 20 h18"/>
    <path d="M27 15 l5 5 -5 5"/>
    <path d="M38 32 h-18"/>
    <path d="M25 27 l-5 5 5 5"/>
  </g>
</svg>
