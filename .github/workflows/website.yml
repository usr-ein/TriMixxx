# trimixxx.e1n.sh: lints and builds website/ on every change to it, and
# publishes main to GitHub Pages (Settings → Pages → Source: GitHub Actions;
# the custom domain is set there too).
#
# The checkout is sparse: the site never reads the rest of the repository
# (~340 MB of KiCad files, captures and binaries). The photographs come from
# their own repository, cloned shallow by `npm run media`; without it the site
# still builds, with no photos.
#
# Actions are pinned to the commit of a release, with the release as a comment.
name: website

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - ".github/workflows/website.yml"
  pull_request:
    paths:
      - "website/**"
      - ".github/workflows/website.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: website
          filter: blob:none

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: website/.nvmrc
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install
        run: npm ci

      # Astro keeps every picture it has already resized here; restoring it
      # turns a ~45 s image pass into a few seconds.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: website/node_modules/.astro
          key: astro-${{ hashFiles('website/package-lock.json') }}-${{ github.sha }}
          restore-keys: astro-${{ hashFiles('website/package-lock.json') }}-

      - name: Photos
        run: npm run media

      # Prettier, ESLint, Stylelint and astro check, with no warning allowed.
      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Upload the site
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: website/dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
