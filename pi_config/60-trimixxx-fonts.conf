<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  Font fallback chain for the deck's UI.

  Why this file has to exist at all: Mixxx stores ONE family name. The track
  table font is [Library] Font in mixxx.cfg, which Mixxx hands to
  QFont::fromString() as a "family,pointsize" pair, and the skin's stylesheet
  names the same family. Neither is a place to express "and if a character is
  missing, try these next". Per-character fallback is fontconfig's job, and
  without a rule fontconfig picks a substitute by its own generic ordering.

  MesloLGL Nerd Font (../mixxx_config/fonts) is a terminal font: about 13k
  codepoints covering Latin, Greek, Cyrillic, punctuation, symbols and the Nerd
  Font icons. Everything else in a track title (Japanese, Korean, Chinese,
  Arabic, Hebrew, the Indic scripts, Thai, emoji) is absent, and on a Pi the
  substitute is whatever happens to be installed. That is the tofu-box problem
  this fixes.

  <prefer> APPENDS to the match list rather than replacing it, so Meslo still
  wins for every glyph it actually has; these only get consulted for the ones it
  does not. Order is deliberate:

    Noto Sans           the broad scripts (Cyrillic/Greek extras, Arabic, Hebrew,
                        Devanagari, Bengali, Gurmukhi, Tamil, Telugu, Kannada,
                        Sinhala, Thai, Lao, Georgian, Armenian)
    Noto Sans CJK JP    Japanese first: kana are unambiguous, and the Han glyphs
    Noto Sans CJK SC    are shared, so JP covers most CJK titles. SC/KR follow
    Noto Sans CJK KR    for the characters JP does not carry.
    Noto Sans Symbols 2 Braille patterns, arrows, misc technical
    Noto Color Emoji    emoji, which turn up in track and playlist names a lot
    DejaVu Sans         last resort, always present on Raspberry Pi OS

  Installed to /etc/fonts/conf.d by ../pi_config/upload.sh, which also installs
  the fonts-noto-* packages the families above come from. The 60- prefix is the
  fontconfig convention for family-preference rules (60-latin.conf and friends);
  it must sort after the 50-* config loading and before the 70-* selection rules.
-->
<fontconfig>
  <alias>
    <family>MesloLGL Nerd Font</family>
    <prefer>
      <family>Noto Sans</family>
      <family>Noto Sans CJK JP</family>
      <family>Noto Sans CJK SC</family>
      <family>Noto Sans CJK KR</family>
      <family>Noto Sans Symbols 2</family>
      <family>Noto Color Emoji</family>
      <family>DejaVu Sans</family>
    </prefer>
  </alias>

  <!-- The same chain for the generic families, so anything in the UI that does
       NOT go through the skin stylesheet (Qt dialogs, tooltips, the preferences
       window) falls back the same way instead of a different way. -->
  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>Noto Sans</family>
      <family>Noto Sans CJK JP</family>
      <family>Noto Color Emoji</family>
      <family>DejaVu Sans</family>
    </prefer>
  </alias>
</fontconfig>
