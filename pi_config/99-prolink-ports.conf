# Let Mixxx bind UDP/111 (the ONC RPC portmapper) as an unprivileged user, so
# the deck can serve its rekordbox USBs to real CDJs over Pro DJ Link.
#
# Why a privileged port is involved at all: a CDJ browsing another player's
# media does not go straight to NFS. It asks the portmapper on UDP/111 which
# ports mountd and nfsd are on, and only then mounts and opens the metadata
# (dbserver) connection. Measured on a CDJ-2000NXS, firmware 1.44:
#
#   media query -> portmap GETPORT -> MNT -> dbserver port query -> dbserver -> READ
#
# With nothing on 111 the deck retries GETPORT once a second indefinitely, never
# falls back to the well-known mountd/nfsd ports (48276 and 2049) even when
# those are bound and idle, and never reaches the dbserver step -- so the deck
# does not merely fail to play, it does not list the deck as a source at all.
# See prolinks-compat/docs/FINDINGS.md F46.
#
# Why the sysctl and not `setcap cap_net_bind_service=+ep /usr/bin/mixxx`:
# ../mixxx/upload.sh deploys by swapping /usr/bin/mixxx itself, which drops file
# capabilities every time. The capability would silently vanish on the next
# deploy and serving would stop working for no visible reason. This setting
# survives, and survives an apt upgrade of the mixxx package too.
#
# What it costs: ports 111-1023 become bindable by any local user, not just
# root. On a multi-user machine that matters -- an unprivileged process could
# squat on 123/ntp, 161/snmp, 514/syslog and so on. The deck is a single-user
# appliance with one interactive account, so the exposure is theoretical, but it
# is a real loosening and worth knowing about rather than discovering.
#
# Despite the `ipv4` in the name this governs IPv6 binds as well; Linux never
# added a separate knob.
#
# To revert: delete this file and reboot (or `sysctl -w
# net.ipv4.ip_unprivileged_port_start=1024`). Serving stops; browsing other
# players' media is unaffected, since consuming needs no privileged port.
net.ipv4.ip_unprivileged_port_start = 111
