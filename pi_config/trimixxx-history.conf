# The History's store (the browser's History: what played on the link, the last
# three power-ups), made at every start by systemd-tmpfiles. Mixxx writes it as
# the deck's user; nothing else does.
#
# On the state partition, p8, mounted here on a release card: the one partition
# both slots share and an update keeps, and the only one written while the deck
# runs (pi-qemu/PLAN.md 1.4). Beside RAUC's own state and the health check's log.
# On a dev card, a directory of the root, which is on the card as well.
#
# Made after local-fs.target, so on a release card inside the mounted p8. If p8
# would not mount (nofail), it is made in RAM, and the History lasts that
# power-up only: the deck still starts, and plays.
d /var/lib/rauc/trimixxx-history 0755 sam1902 sam1902 -
