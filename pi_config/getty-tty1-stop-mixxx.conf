# Let Mixxx shut down cleanly when the tty1 session is stopped.
#
# Installed as a drop-in at
# /etc/systemd/system/getty@tty1.service.d/10-trimixxx-stop-mixxx.conf
#
# THE PROBLEM. `sudo systemctl stop getty@tty1.service` tears down the whole
# session scope at once. Mixxx now handles SIGHUP/SIGTERM and begins a graceful
# quit, but X is in the same scope and dies in the same instant, so the shutdown
# gets a few milliseconds before Qt hits
#
#   The X11 connection broke (error 1). Did the X11 server die?
#
# and the process aborts part-way through -- settings unwritten, threads
# unjoined, "deleting Library" never reached. Handling the signal was necessary
# but not sufficient; something has to give Mixxx a moment on its own.
#
# WHAT THIS DOES. ExecStop runs *before* systemd kills the scope, so Mixxx is
# asked to quit while X is still alive, and the second line waits for it to
# actually go. Only then does the normal teardown proceed.
#
# The leading `-` on each line means a failure is not an error: if Mixxx is not
# running, or has already exited, stopping the getty must still succeed.
#
# TimeoutStopSec covers the wait plus the rest of the session teardown. Mixxx's
# own shutdown is well under a second in practice; the headroom is for a fetch
# in flight, since the ProLink network thread is joined during that path.
[Service]
ExecStop=-/usr/bin/pkill -TERM -x mixxx
ExecStop=-/bin/sh -c 'for i in $(seq 1 150); do pgrep -x mixxx >/dev/null || exit 0; sleep 0.1; done'
TimeoutStopSec=30
