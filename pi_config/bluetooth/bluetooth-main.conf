# bluetoothd's settings for the deck's Bluetooth receiver: read through
# trimixxx-bluetoothd.service's `-f`, in place of /etc/bluetooth/main.conf,
# which stays as the package left it. Anything not set here is BlueZ's default.
[General]
# A loudspeaker (Audio/Video, Loudspeaker; the Audio service bit), which is how
# a phone or a Mac shows the deck in its list. The name is the deck's hostname.
Class = 0x200414
# Visible for two minutes after the DJ asks to pair a new device, and only
# then: Mixxx sets Discoverable, and BlueZ ends it by itself.
DiscoverableTimeout = 120
PairableTimeout = 120
# Devices it knows reconnect quicker while the menu is open (page scan at a
# shorter interval: more power, only while the radio is up at all).
FastConnectable = true
JustWorksRepairing = never
# The cover's port (MediaPlayer1.ObexPort), which BlueZ 5.82 shows only to
# experimental clients: without it no cover session is opened, and a device
# sends no cover (AVRCP 1.6 gives a track's image handle only while one is
# open). It adds D-Bus API and nothing else: no radio or pairing changes.
Experimental = true

[Policy]
AutoEnable = true
