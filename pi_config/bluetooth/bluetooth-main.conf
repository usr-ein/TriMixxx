# bluetoothd's settings for the deck's Bluetooth receiver: read through
# trimixxx-bluetoothd.service's `-f`, in place of /etc/bluetooth/main.conf,
# which stays as the package left it. Anything not set here is BlueZ's default.
[General]
# A loudspeaker (Audio/Video, Loudspeaker; the Audio service bit), which is how
# a phone shows the deck in its list. The name is the deck's hostname.
Class = 0x200414
# Visible for two minutes after Pair is pressed, and only then: Mixxx sets
# Discoverable on Pair, and BlueZ ends it by itself.
DiscoverableTimeout = 120
PairableTimeout = 120
# Phones it knows reconnect quicker while the menu is open (page scan at a
# shorter interval: more power, only while the radio is up at all).
FastConnectable = true
JustWorksRepairing = never

[Policy]
AutoEnable = true
