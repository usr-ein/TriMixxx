# RAUC on a TriMixxx release card (pi-qemu/PLAN.md Part 1): two slots, each a
# root (SquashFS, written raw) with its boot partition (FAT, written raw), and
# the Pi firmware's tryboot to try one and commit it (rpi-tryboot).
# Partitions by PARTUUID: the card's disk signature is fixed (5d0bc1ec).
[system]
compatible=trimixxx-pi4
bootloader=custom
data-directory=/var/lib/rauc
# Plain bundles while the decks carry RAUC 1.13 (PLAN.md invariant 10).
bundle-formats=plain

[keyring]
path=/etc/rauc/keyring.pem

[handlers]
bootloader-custom-backend=/usr/lib/rauc/rpi-tryboot

[slot.rootfs.0]
device=/dev/disk/by-partuuid/5d0bc1ec-05
type=raw
bootname=A

[slot.boot.0]
device=/dev/disk/by-partuuid/5d0bc1ec-02
type=vfat
parent=rootfs.0

[slot.rootfs.1]
device=/dev/disk/by-partuuid/5d0bc1ec-06
type=raw
bootname=B

[slot.boot.1]
device=/dev/disk/by-partuuid/5d0bc1ec-03
type=vfat
parent=rootfs.1
