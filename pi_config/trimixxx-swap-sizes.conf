# /etc/rpi/swap.conf.d/ drop-in: zram only, at the size rpi-swap would work out
# anyway (RAM x1, capped at 2048 MiB).
#
# zram only (Sam, 2026-10-08): no swap file behind it. A release card's root is
# read-only with RAM on top (overlayroot), where /var/swap would only take RAM,
# and the dev decks run the same setting. rpi-swap removes the old /var/swap.
#
# The size is pinned so rpi-swap's boot-time generator skips the calculation:
# it runs `ack` -- a Perl program -- to read MemTotal, once per size, on every
# boot. On a cold boot that made rpi-swap-generator the slowest generator by far
# (~1.4 s), and no unit at all starts until every generator has finished.
# Pinned, the generator writes byte-identical units in a fraction of that.
# Change it if the deck ever gets a different amount of RAM.
[Main]
Mechanism=zram

[Zram]
FixedSizeMiB=2048
