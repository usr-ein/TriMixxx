# /etc/rpi/swap.conf.d/ drop-in: pin the swap sizes rpi-swap would work out
# anyway (RAM x1, capped at 2048 MiB, for both the zram device and the file
# behind it), so its boot-time generator skips the calculation.
#
# The calculators run `ack` -- a Perl program -- to read MemTotal, once per
# size, on every boot. On a cold boot that made rpi-swap-generator the slowest
# generator by far (~1.4 s), and no unit at all starts until every generator has
# finished. Pinned, the generator writes byte-identical units in a fraction of
# that. Change these if the deck ever gets a different amount of RAM.
[File]
FixedSizeMiB=2048

[Zram]
FixedSizeMiB=2048
