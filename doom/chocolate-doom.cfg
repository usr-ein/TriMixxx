// Chocolate Doom -- the extended (non-vanilla) settings, installed to
// ~/.local/share/chocolate-doom/chocolate-doom.cfg. Rewritten by the game on
// exit, like default.cfg.

// The deck's panel is 1024x600 and there is no window manager to speak of
// (matchbox, no titlebar), so: fullscreen, correct aspect, no tearing.
fullscreen                1
aspect_ratio_correct      1
vsync                     1

// The mouse must be grabbed for relative motion to work, which is the whole
// jog-wheel-as-turn-axis trick.
grabmouse                 1

// No joystick: the deck's controls arrive as a KEYBOARD and a MOUSE, from
// trimixxx-deckkeys. Leaving joystick support on would only give SDL a chance to
// find something else and misread it.
use_joystick              0

// Digital sound effects on.
snd_sfxdevice             3

// Music OFF, on purpose, and this is the one setting worth changing by hand.
//
// The value that means "OPL/Adlib" (the authentic 1993 sound, emulated inside
// Chocolate Doom with no extra packages) versus "native MIDI" (needs a
// soundfont) has moved between builds, and guessing it here would either be
// silent anyway or throw an error at startup. So it ships silent and known-good:
//
//     chocolate-doom-setup   ->  Configure Sound  ->  Music: OPL (Adlib)
//
// which writes the right number into this same file.
snd_musicdevice           0
