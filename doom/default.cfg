// Chocolate Doom -- vanilla-compatible settings, installed to
// ~/.local/share/chocolate-doom/default.cfg. Doom rewrites this file on exit,
// so it is a starting point, not a lock.
//
// The track encoder: Doom's own weapon cycling, which SKIPS the weapons you are
// not carrying. Cycling the digits 1..7 instead walks through all seven slots,
// and selecting a weapon you do not own does nothing at all -- which is what
// made the encoder feel dead at the start of E1M1, where five of the seven are
// missing.
//
// These two are the only key_* lines here, because Chocolate Doom leaves them
// UNBOUND by default (verified: `key_prevweapon`/`key_nextweapon` exist in the
// 3.1.0 binary). The values are DOOM's internal key codes, which for a printable
// key are simply its ASCII value -- the same rule as the stock config's
// `key_use 32` (space), `key_strafeleft 44` (","), `key_straferight 46` (".").
// So 91 is "[" and 93 is "]", which is what trimixxx-deckkeys taps.
key_prevweapon            91
key_nextweapon            93

// WHAT IS DELIBERATELY MISSING: every OTHER key_* line.
//
// The deck's virtual keyboard is mapped to the keys Doom ALREADY binds by
// default -- arrows, Ctrl, Space, comma/period, Shift, 1-7, Tab, Esc, Enter, y
// (see ../trimixxx-launcher/internal/keymap/doom.go). Binding to the defaults
// means there is nothing here to get wrong, and that matters more than it
// sounds: key_* values in this file are DOOM's own internal key codes, not
// Linux ones and not ASCII, so hand-authoring them is the single easiest way to
// end up with a deck that presses nothing. Change the Go table instead.

mouse_sensitivity         5
use_mouse                 1

// Nothing on the deck can click, and Doom's mouse buttons default to
// fire/strafe/forward -- explicitly unbound so a stray click cannot fire.
mouseb_fire               -1
mouseb_strafe             -1
mouseb_forward            -1

sfx_volume                8
music_volume              8
show_messages             1

// 10 = the full screen with the status bar. 11 would be borderless, but the
// status bar is how you read health and ammo, and there is nowhere else to put
// them on a deck with no HUD.
screenblocks              10
detaillevel               0
