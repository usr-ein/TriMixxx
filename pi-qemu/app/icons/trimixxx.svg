<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <title>TriMixxx</title>
  <desc>pi-qemu's icon: a green phosphor T on a CRT tube, with scanlines and horizontal glitch lines. The T is the IBM PC's 8x8 BIOS glyph, in the colours of pi_config/trimixxx_logo_crt.svg.</desc>
  <defs>
    <!-- The T: rows FC B4 30 30 30 30 78 of the IBM PC's 8x8 font, on a
         16-unit grid, so at 16x16 it lands on whole pixels. -->
    <path id="T" d="M80 64h96v32h-16v-16h-16v80h16v16h-64v-16h16v-80h-16v16h-16z"/>
    <!-- The beam: colour fringes either side, mint phosphor on top. -->
    <g id="beam">
      <use href="#T" fill="#ff2f5e" opacity="0.45" transform="translate(-4,0)"/>
      <use href="#T" fill="#2fd2ff" opacity="0.45" transform="translate(4,0)"/>
      <use href="#T" fill="#a6ffc8"/>
    </g>
    <!-- The tube's face: a rounded square, its edges bowed outwards. -->
    <path id="tube" d="M70 26Q128 18 186 26Q224.67 31.33 230 70Q238 128 230 186Q224.67 224.67 186 230Q128 238 70 230Q31.33 224.67 26 186Q18 128 26 70Q31.33 31.33 70 26z"/>
    <clipPath id="glass"><use href="#tube"/></clipPath>
    <!-- Glitch bands: A and C are slivers echoed sideways, B is torn out
         of the picture and put back 11 units to the left. -->
    <clipPath id="bandA"><rect y="70" width="256" height="5"/></clipPath>
    <clipPath id="bandB"><rect y="128" width="256" height="7"/></clipPath>
    <clipPath id="bandC"><rect y="160" width="256" height="2"/></clipPath>
    <mask id="tear" maskUnits="userSpaceOnUse" x="0" y="0" width="256" height="256">
      <rect width="256" height="256" fill="#fff"/>
      <rect y="128" width="256" height="7" fill="#000"/>
    </mask>
    <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#000" opacity="0.42"/>
    </pattern>

    <radialGradient id="phosphor" cx="0.5" cy="0.47" r="0.72">
      <stop offset="0" stop-color="#103322"/>
      <stop offset="0.6" stop-color="#081d11"/>
      <stop offset="1" stop-color="#020805"/>
    </radialGradient>
    <linearGradient id="roll" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7dffb0" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#7dffb0" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#7dffb0" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="reflection" gradientUnits="userSpaceOnUse" cx="33" cy="32" r="132">
      <stop offset="0" stop-color="#fff" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>

    <filter id="bloom" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="11"/></filter>
    <filter id="halo" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="smear" x="-10%" y="-400%" width="120%" height="900%"><feGaussianBlur stdDeviation="1.8"/></filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="5"/></filter>
  </defs>

  <use href="#tube" fill="#000" opacity="0.45" filter="url(#shadow)" transform="translate(0,4)"/>
  <use href="#tube" fill="url(#phosphor)"/>
  <g clip-path="url(#glass)">
    <rect y="112" width="256" height="48" fill="url(#roll)"/>
    <use href="#T" fill="#1fae5e" opacity="0.9" filter="url(#bloom)"/>
    <use href="#T" fill="#4fe08b" opacity="0.7" filter="url(#halo)"/>
    <use href="#beam" mask="url(#tear)"/>
    <g clip-path="url(#bandB)"><use href="#beam" transform="translate(-11,0)"/></g>
    <g clip-path="url(#bandA)" opacity="0.75"><use href="#T" fill="#eafff2" transform="translate(12,0)"/></g>
    <g clip-path="url(#bandC)" opacity="0.55"><use href="#T" fill="#f4fff8" transform="translate(8,0)"/></g>
    <!-- blip lines across the picture -->
    <rect y="128" width="256" height="2.5" fill="#7dffb0" opacity="0.8" filter="url(#smear)"/>
    <rect y="128" width="256" height="1.5" fill="#d8ffe6" opacity="0.55"/>
    <rect y="161" width="256" height="1.2" fill="#bdffd6" opacity="0.35"/>
    <rect y="102" width="256" height="4" fill="#000" opacity="0.5"/>
    <rect width="256" height="256" fill="url(#scanlines)"/>
    <path d="M30 104C30 58 36 29 70 29L166 29C110 34 62 50 30 104z" fill="url(#reflection)"/>
  </g>
  <!-- the outline: the logo's bracket green, keylined in black -->
  <use href="#tube" fill="none" stroke="#000" stroke-width="8" opacity="0.75"/>
  <use href="#tube" fill="none" stroke="#2c8c5a" stroke-width="5"/>
</svg>
