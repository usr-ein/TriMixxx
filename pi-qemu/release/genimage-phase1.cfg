# Phase 1's test card for trimixxx3 (pi-qemu/PLAN.md §2.1): the release's
# partitions, with Pi OS's boot files in each boot partition and its root,
# shared by all, in slot A's place. `make phase1` fills ${WORK} and sets
# ${DISK_ID}.
#
#   p1  BOOTSEL   FAT32  256M  autoboot.txt, and boot files of its own (slot R)
#   p2  bootfs    FAT32  512M  slot A
#   p3  bootfs-b  FAT32  512M  slot B
#   p4  extended
#   p5  rootfs    ext4   4G    Pi OS's root

image bootsel.vfat {
	vfat {
		label = "BOOTSEL"
		extraargs = "-F 32"
	}
	srcpath = "${WORK}/bootsel"
	size = 256M
	temporary = true
}

image boot-a.vfat {
	vfat {
		label = "bootfs"
		extraargs = "-F 32"
	}
	srcpath = "${WORK}/boot-a"
	size = 512M
	temporary = true
}

image boot-b.vfat {
	vfat {
		label = "bootfs-b"
		extraargs = "-F 32"
	}
	srcpath = "${WORK}/boot-b"
	size = 512M
	temporary = true
}

image trimixxx3-phase1.img {
	hdimage {
		partition-table-type = "mbr"
		disk-signature = ${DISK_ID}
		extended-partition = 4
		align = 4M
		fill = true
	}
	partition bootsel {
		partition-type = 0x0c
		offset = 8M
		image = "bootsel.vfat"
	}
	partition boot-a {
		partition-type = 0x0c
		image = "boot-a.vfat"
	}
	partition boot-b {
		partition-type = 0x0c
		image = "boot-b.vfat"
	}
	partition rootfs {
		partition-type = 0x83
		image = "root.ext4"
	}
}
