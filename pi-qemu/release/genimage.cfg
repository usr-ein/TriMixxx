# A TriMixxx release card (pi-qemu/PLAN.md §1.4), from `make release`, which
# fills ${WORK}, sets ${DISK_ID}, and names the card after the version:
#
#   p1  BOOTSEL         FAT32  64M   autoboot.txt, and nothing else (invariant 13)
#   p2  bootfs          FAT32  512M  slot A's boot files: the release's
#   p3  (empty)                512M  slot B's, written by RAUC
#   p4  extended
#   p5  rootfs          SquashFS 4G  slot A's system: the release's
#   p6  (empty)                4G    slot B's, written by RAUC
#   p7  trimixxx-data   ext4   64M   the deck's identity: empty here, `make card`
#   p8  trimixxx-state  ext4   4G    RAUC's state and the bundles it installs
#
# p8 ends the card at about 13 GiB, so it flashes onto any card of 16 GB or
# more; the rest of a bigger card stays unused.

image bootsel.vfat {
	vfat {
		label = "BOOTSEL"
		extraargs = "-F 32 -s 1"
	}
	srcpath = "${WORK}/bootsel"
	size = 64M
	temporary = true
}

image boot.vfat {
	vfat {
		label = "bootfs"
		extraargs = "-F 32"
	}
	srcpath = "${WORK}/boot"
	size = 512M
}

image data.ext4 {
	ext4 {
		label = "trimixxx-data"
		use-mke2fs = true
	}
	empty = true
	size = 64M
	temporary = true
}

image state.ext4 {
	ext4 {
		label = "trimixxx-state"
		use-mke2fs = true
	}
	empty = true
	size = 4G
	temporary = true
}

image trimixxx.img {
	hdimage {
		partition-table-type = "mbr"
		disk-signature = ${DISK_ID}
		extended-partition = 4
		align = 4M
		fill = true
	}
	partition bootsel {
		partition-type = 0x0c
		offset = 8M
		image = "bootsel.vfat"
	}
	partition boot-a {
		partition-type = 0x0c
		image = "boot.vfat"
	}
	partition boot-b {
		partition-type = 0x0c
		size = 512M
	}
	partition rootfs-a {
		partition-type = 0x83
		image = "rootfs.squashfs"
		size = 4G
	}
	partition rootfs-b {
		partition-type = 0x83
		size = 4G
	}
	partition data {
		partition-type = 0x83
		image = "data.ext4"
	}
	partition state {
		partition-type = 0x83
		image = "state.ext4"
	}
}
